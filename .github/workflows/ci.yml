name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            client/pnpm-lock.yaml
            server/pnpm-lock.yaml

      - name: Install client dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Lint client
        working-directory: client
        run: pnpm run lint

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Lint server
        working-directory: server
        run: pnpm run lint

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            client/pnpm-lock.yaml
            server/pnpm-lock.yaml

      - name: Install client dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Build client
        working-directory: client
        run: pnpm run build

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Build server
        working-directory: server
        run: pnpm run build

  test:
    needs: lint
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ofix_test
          MYSQL_USER: ofix
          MYSQL_PASSWORD: ofix123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Type check server
        working-directory: server
        run: pnpm run typecheck
        env:
          DATABASE_URL: mysql://ofix:ofix123@127.0.0.1:3306/ofix_test
          AUTH0_AUDIENCE: ci-placeholder
          AUTH0_ISSUER_BASE_URL: https://ci-placeholder.auth0.com
          GEMINI_API_KEY: ci-placeholder

      - name: Apply migrations to test DB
        working-directory: server
        run: pnpm run db:migrate:test
        env:
          DATABASE_URL: mysql://ofix:ofix123@127.0.0.1:3306/ofix_test
          AUTH0_AUDIENCE: ci-placeholder
          AUTH0_ISSUER_BASE_URL: https://ci-placeholder.auth0.com
          GEMINI_API_KEY: ci-placeholder

      - name: Run tests
        working-directory: server
        run: pnpm test
        env:
          DATABASE_URL: mysql://ofix:ofix123@127.0.0.1:3306/ofix_test
          AUTH0_AUDIENCE: ci-placeholder
          AUTH0_ISSUER_BASE_URL: https://ci-placeholder.auth0.com
          GEMINI_API_KEY: ci-placeholder
