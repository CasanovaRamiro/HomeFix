name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            client/pnpm-lock.yaml
            server/pnpm-lock.yaml

      - name: Install client dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Lint client
        working-directory: client
        run: pnpm run lint

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Lint server
        working-directory: server
        run: pnpm run lint

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            client/pnpm-lock.yaml
            server/pnpm-lock.yaml

      - name: Install client dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Build client
        working-directory: client
        run: pnpm run build

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Build server
        working-directory: server
        run: pnpm run build

  test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      HF_TEST_DB_URL: mysql://hf_test_runner:${{ github.run_id }}@127.0.0.1:3306/ofix_hf_tests
      HF_TEST_DB_TARGET: 127.0.0.1:3306
      HF_TEST_DB_PRINCIPAL: hf_test_runner@%
      HF_TEST_DB_CONFIRM: I_AUTHORIZE_DISPOSABLE_HF_TESTS

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ofix_hf_tests
          MYSQL_USER: hf_test_runner
          MYSQL_PASSWORD: ${{ github.run_id }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Type check server
        working-directory: server
        run: pnpm run typecheck
        env:
          DATABASE_URL: mysql://blocked:blocked@127.0.0.1:1/unavailable
          AUTH0_AUDIENCE: ci-placeholder
          AUTH0_ISSUER_BASE_URL: https://ci-placeholder.auth0.com
          GEMINI_API_KEY: ci-placeholder
          CLOUDINARY_CLOUD_NAME: ci-placeholder
          CLOUDINARY_API_KEY: ci-placeholder
          CLOUDINARY_API_SECRET: ci-placeholder

      - name: Pin ephemeral test MySQL instance
        working-directory: server
        run: echo "HF_TEST_DB_SERVER_UUID=$(pnpm exec tsx scripts/read-test-db-id.ts)" >> "$GITHUB_ENV"

      - name: Apply schema to disposable test DB
        working-directory: server
        run: pnpm run db:migrate:test
        env:
          AUTH0_AUDIENCE: ci-placeholder
          AUTH0_ISSUER_BASE_URL: https://ci-placeholder.auth0.com
          GEMINI_API_KEY: ci-placeholder
          CLOUDINARY_CLOUD_NAME: ci-placeholder
          CLOUDINARY_API_KEY: ci-placeholder
          CLOUDINARY_API_SECRET: ci-placeholder

      - name: Run unit tests
        working-directory: server
        run: pnpm test
        env:
          AUTH0_AUDIENCE: ci-placeholder
          AUTH0_ISSUER_BASE_URL: https://ci-placeholder.auth0.com
          GEMINI_API_KEY: ci-placeholder
          CLOUDINARY_CLOUD_NAME: ci-placeholder
          CLOUDINARY_API_KEY: ci-placeholder
          CLOUDINARY_API_SECRET: ci-placeholder

      - name: Run database and route tests
        working-directory: server
        run: pnpm run test:db
        env:
          AUTH0_AUDIENCE: ci-placeholder
          AUTH0_ISSUER_BASE_URL: https://ci-placeholder.auth0.com
          GEMINI_API_KEY: ci-placeholder
          CLOUDINARY_CLOUD_NAME: ci-placeholder
          CLOUDINARY_API_KEY: ci-placeholder
          CLOUDINARY_API_SECRET: ci-placeholder
